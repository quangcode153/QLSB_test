server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Fallback to index.html for Single Page Applications (Blazor WASM client routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure correct MIME type for WebAssembly and .NET DLL binaries
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream dll;
        application/octet-stream dat;
        application/json json;
    }

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm;

    # Cache static framework assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|wasm|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
