<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportChain Manager - Hệ Thống Quản Lý Chuỗi Sân Thể Thao Thông Minh</title>
    <base href="/" />
    
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS & Icons -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SportChain.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">
            <div class="spinner-border text-success" role="status" style="width: 3.5rem; height: 3.5rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h4 class="mt-4 fw-bold text-dark" style="font-family: 'Outfit', sans-serif;">SportChain Manager</h4>
            <p class="text-muted">Đang tải ứng dụng điều hành chuỗi sân realtime...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Đã có sự cố kết nối giao diện xảy ra.
        <a href="" class="reload">Tải lại</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>

</html>
